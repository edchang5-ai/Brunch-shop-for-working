<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>彰化市 Brunch 工作情報</title>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --ink: #2b2b2b;
      --muted: #8a857d;
      --accent: #b5651d;
      --border: #e8e2d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    header h1 { font-size: 28px; }
    header p { color: var(--muted); margin-top: 6px; }

    .search-box {
      max-width: 720px;
      margin: 20px auto;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .search-box label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
    }
    .row select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
    }
    button {
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.secondary {
      background: #fff;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .toolbar {
      max-width: 720px;
      margin: 8px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .toolbar .count { color: var(--muted); font-size: 14px; }

    #results {
      max-width: 720px;
      margin: 0 auto 60px;
      padding: 0 20px;
      display: grid;
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .card h3 { font-size: 18px; margin-bottom: 2px; }
    .card .address { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .badge {
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 20px;
      background: #f1ece4;
      color: #5c564d;
      border: 1px solid var(--border);
    }
    .badge.yes { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
    .badge.no  { background: #fdecea; color: #c62828; border-color: #ef9a9a; }
    .badge.unknown { background: #fff8e1; color: #8d6e00; border-color: #ffe082; }

    .analysis {
      border-top: 1px dashed var(--border);
      padding-top: 10px;
      margin-top: 4px;
      font-size: 14px;
      color: var(--ink);
    }
    .analysis .summary { margin-top: 6px; color: #555; font-size: 13.5px; }
    .analysis .loading { color: var(--muted); }
    .error {
      background: #fdecea;
      color: #c62828;
      border: 1px solid #ef9a9a;
      padding: 10px 14px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 14px;
    }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>彰化市 Brunch 工作情報</h1>
    <p>查詢早午餐店的營業時間、插座電源與咖啡供應</p>
  </header>

  <form class="search-box" id="search-form">
    <label for="query">搜尋店家</label>
    <div class="row">
      <input type="text" id="query" value="彰化市 brunch" placeholder="例如：彰化市 brunch" />
      <select id="count">
        <option value="5">5 間</option>
        <option value="10" selected>10 間</option>
        <option value="15">15 間</option>
        <option value="20">20 間</option>
      </select>
      <button type="submit">搜尋</button>
    </div>
  </form>

  <div class="toolbar hidden" id="toolbar">
    <span class="count" id="count-label"></span>
    <button class="secondary" id="analyze-all" type="button">分析全部（電源 / 咖啡）</button>
  </div>

  <div id="results"></div>

  <script src="/app.js"></script>
</body>
</html>
